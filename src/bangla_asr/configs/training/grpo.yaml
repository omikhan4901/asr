# GRPO correction training. JSON/CSV logs only — no W&B.
model_id: WeiboAI/VibeThinker-3B
learning_rate: 1.0e-6
batch_size: 1
group_size: 4
max_new_tokens: 128
sampling_temperature: 0.8
kl_coef: 0.05
reward_scale: 1.0
reward_clip: 2.0
max_steps: 100
eval_every: 10
checkpoint_every: 20
checkpoint_dir: checkpoints/grpo
log_dir: logs/grpo
prompt_style: simple
exclude_empty_reference_from_batch: true
