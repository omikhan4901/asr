# Clinical-severity-weighted error rate (SWER) — not Roy 2021 Semantic WER.
# Edit multipliers follow the CSE499 draft. critical_reference_weight is
# interpreted (see bangla_asr.metrics.swer module docstring).
lexicon_path: null
critical_substitution_weight: 5.0
garbled_span_weight: 5.0
minor_substitution_weight: 1.0
critical_deletion_weight: 4.0
noncritical_deletion_weight: 1.0
hallucinated_insertion_weight: 3.0
filler_insertion_weight: 1.0
critical_reference_weight: 5.0
default_reference_weight: 1.0
# composite = explicit list OR illegal Bangla orthography OR far-OOV
garbled_detector: composite
garbled_wordlist_path: null
garbled_edit_threshold: 2
treat_oov_as_garbled: false
