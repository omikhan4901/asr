<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bangla ASR Labeling</title>
<style>
  :root { --bg:#f7f7f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#2f5d8a; --accent-ink:#fff; --ok:#2e7d4f; --mark:#fff0b3; --mark2:#dbe9f7; --bad:#a33a2b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151514; --card:#1e1e1c; --ink:#ececea; --muted:#a3a39d; --line:#33332f; --accent:#7fb0e0; --accent-ink:#10202f; --ok:#6cc08f; --mark:#5a4a10; --mark2:#1f3a55; --bad:#e08070; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .bn { font-family:"Noto Sans Bengali", "Nirmala UI", "Vrinda", sans-serif; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header b { font-size:15px; }
  .muted { color:var(--muted); font-size:14px; }
  .spacer { flex:1; }
  main { max-width:880px; margin:0 auto; padding:20px 16px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; margin-bottom:14px; }
  button, .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 13px; border-radius:6px; cursor:pointer; font:inherit; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  button.sel { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); font-weight:600; }
  input[type=text], input[type=password], textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea { min-height:120px; font-size:20px; line-height:1.6; }
  label.f { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--ok); }
  .tasks { display:grid; gap:14px; }
  .task h2 { margin:0 0 4px; font-size:18px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  audio { width:100%; margin:6px 0 10px; }
  .text { font-size:20px; line-height:1.7; padding:10px 12px; border:1px dashed var(--line); border-radius:6px; }
  .choices { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin-top:8px; }
  .choices button { text-align:left; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:12px; font-family:inherit; }
  .w { padding:1px 2px; border-radius:3px; }
  .w.u { background:var(--mark); cursor:pointer; }
  .w.u.cur { background:var(--mark2); outline:2px solid var(--accent); }
  .w.u.lab { background:transparent; text-decoration:underline; text-decoration-color:var(--ok); text-decoration-thickness:2px; }
  .gap { color:var(--muted); }
  .dd { color:var(--bad); text-decoration:line-through; }
  .di { background:color-mix(in srgb, var(--ok) 22%, transparent); color:var(--ink); text-decoration:none; border-radius:3px; padding:0 2px; }
  .dm { background:var(--mark); border-radius:3px; padding:0 2px; }
  .chg { font-size:15px; margin-top:6px; }
  .unit { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .unit .pairtxt { min-width:200px; font-size:18px; }
  .unit.cur { background:color-mix(in srgb, var(--mark2) 45%, transparent); }
  .pair { font-size:34px; text-align:center; margin:6px 0 14px; }
  .ex { border-top:1px solid var(--line); padding:10px 0; font-size:18px; }
  .ex b { font-weight:400; background:var(--mark); border-radius:3px; padding:0 3px; }
  .ex .k { font:13px system-ui, sans-serif; color:var(--muted); display:inline-block; width:92px; }
  .guide { font-size:15px; }
  .guide li { margin:4px 0; }
  .msg { padding:10px 12px; border-radius:6px; background:var(--mark2); margin-bottom:12px; }
  .err { color:var(--bad); }
  .hidden { display:none !important; }
  @media (max-width:600px) { textarea, .text { font-size:18px; } .pair { font-size:26px; } }
</style>
</head>
<body>
<header>
  <b>Bangla ASR Labeling</b>
  <span class="muted" id="hdr-who"></span>
  <span class="spacer"></span>
  <button id="hdr-home" class="hidden">All tasks</button>
  <button id="hdr-guide" class="hidden">Guide</button>
  <button id="hdr-out" class="hidden">Sign out</button>
</header>
<main id="app"></main>

<template id="guide-ref">
  <p><b>References (about 2–3 minutes per chunk).</b> You hear a chunk and see its transcript. Make the text match <b>exactly the words that are spoken</b>.</p>
  <ul>
    <li><b>Fix real mistakes only:</b> missing words, extra words that are not spoken, wrong words.</li>
    <li><b>Ignore punctuation</b> (। , ? ! " and the <code>&gt;&gt;</code> speaker-change marks), even when it is wrong: scoring removes it. If only the punctuation is off, choose <b>Correct as is</b>.</li>
    <li><b>Do not change spelling.</b> If a word is spoken and written in a valid spelling (ছিল / ছিলো, কি / কী, কোন / কোনো), leave it.</li>
    <li><b>Dialect or colloquial speech: write what is said.</b> Speaker says কইরা, text has করে → change to কইরা. If the speaker says the standard form, keep it.</li>
    <li><b>Accent is not dialect:</b> if only one sound is pronounced differently (ঠ said like ঢ: ঢেকালো for ঠেকালো), keep the standard spelling and write <code>accent</code> in the note.</li>
    <li><b>Words cut off at the start or end:</b> keep a word if more than half of it is audible, otherwise remove it; tick "words cut off".</li>
    <li><b>Numbers:</b> as words, as spoken (পঁচিশ, not ২৫). <b>English words:</b> in Bangla script, as the transcript does (ফোন).</li>
    <li>No fillers or hesitations (উম, আ…), laughter or music. Background speech: only the main speaker.</li>
    <li><b>Can't use:</b> the main speech can't be made out (music, noise, overlap, another language).</li>
    <li>Listen as often as you need. If a word is unclear, keep the original and add a note. Don't guess.</li>
  </ul>
  <p><kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves and goes to the next chunk. <kbd>Ctrl</kbd>+<kbd>Space</kbd> plays / pauses.</p>
</template>
<template id="guide-audit">
  <p><b>Error audit (about 1–2 minutes per chunk).</b> You hear a chunk and see two versions: the <b>transcript</b> (from the dataset) and a <b>recognizer's output</b>. Every place where they differ is highlighted. For each difference, listen and choose:</p>
  <ul>
    <li><kbd>1</kbd> <b>Recognizer wrong</b>: the transcript matches the audio, the recognizer doesn't.</li>
    <li><kbd>2</kbd> <b>Transcript wrong</b>: the recognizer matches the audio, the transcript doesn't.</li>
    <li><kbd>3</kbd> <b>Both wrong</b>: neither matches what is said.</li>
    <li><kbd>4</kbd> <b>Same word, spelling differs</b>: both write the spoken word correctly, just spelled differently (ছিল / ছিলো, কি / কী, দু পাশে / দুপাশে).</li>
    <li><kbd>5</kbd> <b>Same word, dialect vs standard</b>: one side writes the spoken dialect form, the other the standard form of the same word (করে / কইরা, তোমার / তুমার). Also use 5 for an accent on one sound (ঢেকালো / ঠেকালো).</li>
    <li><kbd>6</kbd> <b>Can't tell</b>: the audio is unclear here.</li>
  </ul>
  <p>Judge against the audio, not against which version looks nicer. The keys label the selected difference and move to the next one; click a difference to select it. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves and goes on when all are labeled.</p>
</template>
<template id="guide-pair">
  <p><b>Word pairs (about 10 seconds per pair).</b> A word from a transcript (left) and the word a recognizer wrote instead (right), with example sentences. What is the difference?</p>
  <ul>
    <li><kbd>1</kbd> <b>Same word, different spelling</b>: same word and meaning, written two ways (ছিল / ছিলো, কি / কী, রং / রঙ).</li>
    <li><kbd>2</kbd> <b>Dialect or colloquial form</b>: the same word, said the regional or spoken way (নিয়ে / নিয়া, তোমার / তুমার), including an accent on one sound (ঠেকালো / ঢেকালো).</li>
    <li><kbd>3</kbd> <b>Different word</b>: the meaning or grammar changes (আর / আরো, এখন / এখনো, করে / করা).</li>
    <li><kbd>4</kbd> <b>Can't tell</b>.</li>
  </ul>
  <p>Judge the two words, using the examples for context. Pressing a key saves and moves on.</p>
</template>

<script>
const TASKS = {
  ref:   { name: "1. References",  short: "References",  blurb: "Listen and correct the transcript of a chunk.", per: "2–3 min per chunk" },
  audit: { name: "2. Error audit", short: "Error audit", blurb: "Listen and judge each difference between transcript and recognizer.", per: "1–2 min per chunk" },
  pair:  { name: "3. Word pairs",  short: "Word pairs",  blurb: "Decide whether two words are the same word spelled differently.", per: "~10 s per pair" },
};
const AUDIT = [["model", "Recognizer wrong"], ["ref", "Transcript wrong"], ["both", "Both wrong"],
               ["spelling", "Same word, spelling differs"], ["dialect", "Same word, dialect vs standard"], ["unsure", "Can't tell"]];
const PAIR = [["spelling", "Same word, different spelling"], ["dialect", "Dialect or colloquial form"],
              ["different", "Different word"], ["unsure", "Can't tell"]];
const S = { pass: "", who: "", task: null, item: null, label: null, showGuide: false, cur: 0, history: [] };
try { Object.assign(S, JSON.parse(localStorage.getItem("asr-label-session") || "{}")); } catch (e) {}
const keep = () => { try { localStorage.setItem("asr-label-session", JSON.stringify({ pass: S.pass, who: S.who })); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Word diff for "Settle disagreements": punctuation ignored (as in scoring), nukta letters in one form.
const toks = (s) => String(s).normalize("NFC").replace(/\u09a1\u09bc/g, "\u09dc").replace(/\u09a2\u09bc/g, "\u09dd")
  .replace(/\u09af\u09bc/g, "\u09df").replace(/[।॥,\-–—.?!:;"'‘’“”()[\]{}<>\/\@#$%^&*_+=~`|]/g, " ").split(/\s+/).filter(Boolean);
function diffWords(a, b) {  // a = original words, b = answer words -> [{t: "eq"|"del"|"ins", w, i}]
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: "eq", w: a[i], i }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { ops.push({ t: "del", w: a[i], i }); i++; }
    else { ops.push({ t: "ins", w: b[j] }); j++; }
  }
  while (i < n) { ops.push({ t: "del", w: a[i], i }); i++; }
  while (j < m) ops.push({ t: "ins", w: b[j++] });
  return ops;
}
const diffHtml = (ops) => ops.map((o) => o.t === "eq" ? esc(o.w) : o.t === "del" ? `<del class="dd">${esc(o.w)}</del>` : `<ins class="di">${esc(o.w)}</ins>`).join(" ");
function diffSummary(ops) {  // "ভাবে → ভাবি · ভোগ → ভুক"
  const out = []; let del = [], ins = [];
  const flush = () => { if (del.length || ins.length) out.push(`${del.length ? esc(del.join(" ")) : "(nothing)"} → ${ins.length ? esc(ins.join(" ")) : "(removed)"}`); del = []; ins = []; };
  for (const o of ops) { if (o.t === "eq") flush(); else (o.t === "del" ? del : ins).push(o.w); }
  flush();
  return out.length ? out.join(" &nbsp;·&nbsp; ") : "no word changes";
}

async function api(action, { query = {}, body } = {}) {
  const qs = new URLSearchParams(query).toString();
  const r = await fetch(`/api/${action}${qs ? "?" + qs : ""}`, {
    method: body ? "POST" : "GET",
    headers: { "content-type": "application/json", "x-passcode": S.pass, "x-annotator": S.who },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({ error: "Network error" }));
  if (r.status === 401 && action !== "login") { S.who = ""; keep(); signIn("Please sign in again."); throw new Error("auth"); }
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

function header() {
  $("hdr-who").textContent = S.who ? `· ${S.who}` : "";
  $("hdr-home").classList.toggle("hidden", !S.task);
  $("hdr-guide").classList.toggle("hidden", !S.task);
  $("hdr-out").classList.toggle("hidden", !S.who);
}
$("hdr-home").onclick = () => home();
$("hdr-guide").onclick = () => { S.showGuide = !S.showGuide; renderItem(); };
$("hdr-out").onclick = () => { S.pass = ""; S.who = ""; keep(); signIn(); };

// ---------- sign in
function signIn(msg) {
  S.task = null; header();
  app.innerHTML = `<div class="card" style="max-width:420px;margin:40px auto">
    ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}
    <label class="f" for="pc">Team passcode</label>
    <input type="password" id="pc" autocomplete="current-password">
    <div class="row"><button class="primary" id="go">Continue</button><span class="err" id="e"></span></div>
    <div id="names" class="row"></div></div>`;
  const go = async () => {
    $("e").textContent = "";
    try {
      S.pass = $("pc").value.trim();
      const { names } = await api("login", { body: { passcode: S.pass } });
      $("names").innerHTML = `<div style="width:100%" class="muted">Who are you?</div>` +
        names.map((n) => `<button data-n="${esc(n)}">${esc(n)}</button>`).join("");
      $("names").onclick = (e) => { const b = e.target.closest("button"); if (b) { S.who = b.dataset.n; keep(); home(); } };
    } catch (err) { $("e").textContent = err.message; }
  };
  $("go").onclick = go;
  $("pc").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("pc").focus();
}

// ---------- home
async function home() {
  S.task = null; S.item = null; header();
  app.innerHTML = `<p class="muted">Loading…</p>`;
  let rows = [], open = {};
  try { ({ rows, open } = await api("progress")); } catch (e) { if (e.message !== "auth") app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const team = {}, mine = {}, people = {};
  for (const r of rows) {
    if (r.annotator === null) team[r.task] = r;
    else { people[r.annotator] = people[r.annotator] || {}; people[r.annotator][r.task] = r.done; if (r.annotator === S.who) mine[r.task] = r.done; }
  }
  app.innerHTML = `<p class="muted">Suggested order: References first (before you have seen recognizer output), then the error audit, then word pairs. Everything saves to the shared database the moment you press Save.</p>
    <div class="tasks">${Object.entries(TASKS).map(([k, t]) => {
      const tm = team[k] || { done: 0, needed: 0 };
      const pct = tm.needed ? Math.min(100, 100 * tm.done / tm.needed) : 0;
      return `<div class="card task"><h2>${t.name}</h2><div class="muted">${t.blurb} · ${t.per}</div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="row" style="margin-top:4px"><span class="muted">Team: ${tm.done} of ${tm.needed} labels · You: ${mine[k] || 0}</span>
        <span class="spacer"></span><button class="primary" data-t="${k}">Start</button></div></div>`;
    }).join("")}</div>
    <div class="card"><b>Settle disagreements together</b>
      <div class="muted">Shared items that people answered differently. Do this together at the end of your separate sessions.</div>
      <div class="row">${Object.entries(TASKS).map(([k, t]) => `<button data-r="${k}">${t.short}: ${open[k] || 0} open</button>`).join("")}</div></div>
    <div class="card"><b>Team</b><table><tr><th>Name</th>${Object.values(TASKS).map((t) => `<th>${t.short}</th>`).join("")}</tr>
    ${Object.entries(people).map(([n, d]) => `<tr><td>${esc(n)}</td>${Object.keys(TASKS).map((k) => `<td>${d[k] || 0}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="4" class="muted">Nothing labeled yet.</td></tr>`}
    </table></div>`;
  app.onclick = (e) => {
    const b = e.target.closest("button[data-t],button[data-r]");
    if (!b) return;
    app.onclick = null;
    if (b.dataset.t) startTask(b.dataset.t); else review(b.dataset.r);
  };
}

// ---------- task flow
async function startTask(task) {
  S.task = task; S.history = []; S.showGuide = localStorage.getItem("asr-guide-seen-" + task) !== "1";
  try { localStorage.setItem("asr-guide-seen-" + task, "1"); } catch (e) {}
  header(); await loadNext();
}
async function loadNext() {
  app.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const r = await api("next", { query: { task: S.task } });
    if (r.done) { app.innerHTML = `<div class="card"><b>Nothing left in this task for you.</b> Thank you! <div class="row"><button id="bk">All tasks</button></div></div>`; $("bk").onclick = home; return; }
    S.item = r.item; S.label = null; S.cur = 0; renderItem();
  } catch (e) { if (e.message !== "auth") app.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
async function loadOwn(id) {
  try { const r = await api("item", { query: { id } }); S.item = r.item; S.label = r.label; S.cur = 0; renderItem(); }
  catch (e) { if (e.message !== "auth") alert(e.message); }
}
async function save(data) {
  const btn = $("save"); if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    await api("label", { body: { item_id: S.item.id, data } });
    if (!S.history.includes(S.item.id)) S.history.push(S.item.id);
    try { localStorage.removeItem("asr-draft-" + S.item.id); } catch (e) {}
    await loadNext();
  } catch (e) { if (e.message !== "auth") { alert("Not saved: " + e.message); if (btn) { btn.disabled = false; btn.textContent = "Save & next →"; } } }
}

function frame(inner) {
  const guide = S.showGuide ? `<div class="card guide">${$("guide-" + S.task).innerHTML}<div class="row"><button id="hide-guide">Hide guide</button></div></div>` : "";
  const prev = S.history.length ? `<button id="prev">← Previous</button>` : "";
  app.innerHTML = `${guide}<div class="row" style="margin:0 0 10px"><b>${TASKS[S.task].name}</b><span class="muted">· ${esc(S.item.id)}${S.label ? " · editing your saved label" : ""}</span>
    <span class="spacer"></span><button id="history">My finished items</button></div>
    <div class="card">${inner}<div class="row">${prev}<span class="spacer"></span><span class="err" id="why"></span><button class="primary" id="save">Save &amp; next →</button></div></div>
    <div id="hist"></div>`;
  if ($("hide-guide")) $("hide-guide").onclick = () => { S.showGuide = false; renderItem(); };
  if ($("prev")) $("prev").onclick = () => {
    // From a new item go to the last saved one; from a saved one, to the one before it.
    const i = S.history.indexOf(S.item.id);
    loadOwn(S.history[i > 0 ? i - 1 : i === 0 ? 0 : S.history.length - 1]);
  };
  $("history").onclick = showHistory;
}
async function showHistory() {
  const { items } = await api("mine", { query: { task: S.task } });
  $("hist").innerHTML = `<div class="card"><b>Your finished items</b> <span class="muted">(click to review or change)</span><div class="row">${
    items.map((x) => `<button data-id="${esc(x.id)}">${esc(x.id)}</button>`).join("") || `<span class="muted">None yet.</span>`}</div></div>`;
  $("hist").onclick = (e) => { const b = e.target.closest("button[data-id]"); if (b) loadOwn(b.dataset.id); };
}
function audioHtml() { return S.item.clip_url ? `<audio id="au" controls preload="auto" src="${esc(S.item.clip_url)}"></audio>` : ""; }
function renderItem() { header(); ({ ref: renderRef, audit: renderAudit, pair: renderPair })[S.task](); }

// ---------- task 1: references
function renderRef() {
  const p = S.item.payload, L = S.label || {};
  let draft = null; try { draft = JSON.parse(localStorage.getItem("asr-draft-" + S.item.id)); } catch (e) {}
  const st = (draft && draft.status) || L.status || "";
  frame(`<div class="muted">${p.duration} s</div>${audioHtml()}
    <label class="f">Original transcript</label><div class="text bn">${esc(p.text)}</div>
    <label class="f" for="tx">What is actually said</label>
    <textarea id="tx" class="bn" spellcheck="false">${esc((draft && draft.text) || L.text || p.text)}</textarea>
    <div class="choices" id="st">${[["correct", "Correct as is"], ["corrected", "Corrected"], ["unusable", "Can't use"]]
      .map(([v, t]) => `<button data-v="${v}" class="${st === v ? "sel" : ""}">${t}</button>`).join("")}</div>
    <label class="f"><input type="checkbox" id="cut" ${(draft ? draft.cut_off : L.cut_off) ? "checked" : ""}> Words cut off at the start or end</label>
    <label class="f" for="nt">Note (optional)</label><input type="text" id="nt" class="bn" value="${esc((draft && draft.note) || L.note || "")}">`);
  const norm = (s) => s.trim().replace(/\s+/g, " ");
  // Same punctuation set as the scoring normalizer: punctuation-only edits are not corrections.
  const words = (s) => norm(s.replace(/[।॥,\-–—.?!:;"'‘’“”()[\]{}<>\/\@#$%^&*_+=~`|]/g, " "));
  let status = st;
  const draftSave = () => { try { localStorage.setItem("asr-draft-" + S.item.id, JSON.stringify(collect())); } catch (e) {} };
  const collect = () => ({ status, text: norm($("tx").value), cut_off: $("cut").checked, note: $("nt").value.trim() });
  const mark = (v) => { status = v; for (const b of $("st").children) b.classList.toggle("sel", b.dataset.v === v); draftSave(); };
  $("st").onclick = (e) => { const b = e.target.closest("button"); if (b) mark(b.dataset.v); };
  $("tx").oninput = () => { const changed = words($("tx").value) !== words(p.text); if (changed && status !== "unusable") mark("corrected"); else if (!changed && status === "corrected") mark("correct"); else draftSave(); };
  $("cut").onchange = draftSave; $("nt").oninput = draftSave;
  $("save").onclick = () => {
    const d = collect();
    if (!d.status) { $("why").textContent = "Choose Correct as is, Corrected, or Can't use."; return; }
    if (d.status === "correct" && words(d.text) !== words(p.text)) { $("why").textContent = "You changed words: choose Corrected."; return; }
    save(d);
  };
}

// Transcript and recognizer lines with every difference highlighted (data-k = unit index).
function auditLines(p) {
  const unitOf = [{}, {}], gaps = [{}, {}];
  p.units.forEach((u, k) => {
    for (let i = u.r0; i < u.r1; i++) unitOf[0][i] = k;
    for (let j = u.h0; j < u.h1; j++) unitOf[1][j] = k;
    if (u.r0 === u.r1) (gaps[0][u.r0] = gaps[0][u.r0] || []).push(k);
    if (u.h0 === u.h1) (gaps[1][u.h0] = gaps[1][u.h0] || []).push(k);
  });
  const line = (ws, side) => {
    const gap = (i) => (gaps[side][i] || []).map((k) => `<span class="w u gap" data-k="${k}">[ ]</span> `).join("");
    return ws.map((w, i) => gap(i) + (unitOf[side][i] === undefined ? `<span class="w">${esc(w)}</span> `
      : `<span class="w u" data-k="${unitOf[side][i]}">${esc(w)}</span> `)).join("") + gap(ws.length);
  };
  return `<label class="f">Transcript</label><div class="text bn" id="lr">${line(p.ref, 0)}</div>
    <label class="f">Recognizer</label><div class="text bn" id="lh">${line(p.hyp, 1)}</div>`;
}
function unitText(p, u) {
  const span = (ws, a, b) => a === b ? `<span class="gap">(nothing)</span>` : esc(ws.slice(a, b).join(" "));
  return `${span(p.ref, u.r0, u.r1)} → ${span(p.hyp, u.h0, u.h1)}`;
}

// ---------- task 2: error audit
function renderAudit() {
  const p = S.item.payload, choices = (S.label && S.label.units) ? [...S.label.units] : p.units.map(() => "");
  frame(`<div class="muted">${p.duration} s · ${p.units.length} difference${p.units.length === 1 ? "" : "s"}</div>${audioHtml()}
    ${auditLines(p)}
    <div id="units">${p.units.map((u, k) => `<div class="unit" data-k="${k}"><span class="muted">${k + 1}</span>
      <span class="pairtxt bn">${unitText(p, u)}</span>
      <span class="choices" style="flex:1;margin:0">${AUDIT.map(([v, t], i) => `<button data-k="${k}" data-v="${v}"><kbd>${i + 1}</kbd> ${t}</button>`).join("")}</span></div>`).join("")}</div>
    <label class="f" for="nt">Note (optional)</label><input type="text" id="nt" class="bn" value="${esc((S.label && S.label.note) || "")}">`);
  const paint = () => {
    document.querySelectorAll(".w.u").forEach((el) => { const k = +el.dataset.k; el.classList.toggle("cur", k === S.cur); el.classList.toggle("lab", !!choices[k] && k !== S.cur); });
    document.querySelectorAll(".unit").forEach((el) => el.classList.toggle("cur", +el.dataset.k === S.cur));
    document.querySelectorAll(".unit button").forEach((b) => b.classList.toggle("sel", choices[+b.dataset.k] === b.dataset.v));
  };
  const choose = (k, v) => {
    choices[k] = v;
    const next = choices.findIndex((c, i) => !c && i > k);
    S.cur = next >= 0 ? next : (choices.findIndex((c) => !c) >= 0 ? choices.findIndex((c) => !c) : k);
    paint();
  };
  app.querySelector("#lr").onclick = app.querySelector("#lh").onclick = (e) => { const el = e.target.closest(".w.u"); if (el) { S.cur = +el.dataset.k; paint(); } };
  $("units").onclick = (e) => { const b = e.target.closest("button[data-v]"); if (b) choose(+b.dataset.k, b.dataset.v); else { const u = e.target.closest(".unit"); if (u) { S.cur = +u.dataset.k; paint(); } } };
  S.keyHandler = (e) => { if (document.activeElement === $("nt")) return; const n = +e.key; if (n >= 1 && n <= AUDIT.length) { choose(S.cur, AUDIT[n - 1][0]); e.preventDefault(); } };
  $("save").onclick = () => {
    const missing = choices.findIndex((c) => !c);
    if (missing >= 0) { S.cur = missing; paint(); $("why").textContent = `Difference ${missing + 1} has no answer yet.`; return; }
    save({ units: choices, note: $("nt").value.trim() });
  };
  paint();
}

// ---------- task 3: word pairs
function renderPair() {
  const p = S.item.payload, cur = S.label ? S.label.label : "";
  const hl = (ws, i) => ws.map((w, k) => k === i ? `<b>${esc(w)}</b>` : esc(w)).join(" ");
  frame(`<div class="pair bn">${esc(p.ref_word)} <span class="muted">→</span> ${esc(p.hyp_word)}</div>
    ${p.examples.map((x) => `<div class="ex bn"><span class="k">Transcript</span>${hl(x.ref, x.ref_i)}<br><span class="k">Recognizer</span>${hl(x.hyp, x.hyp_i)}</div>`).join("")}
    <div class="choices" id="pl">${PAIR.map(([v, t], i) => `<button data-v="${v}" class="${cur === v ? "sel" : ""}"><kbd>${i + 1}</kbd> ${t}</button>`).join("")}</div>
    <label class="f" for="nt">Note (optional)</label><input type="text" id="nt" class="bn" value="${esc((S.label && S.label.note) || "")}">`);
  $("save").classList.add("hidden");
  const pick = (v) => save({ label: v, note: $("nt").value.trim() });
  $("pl").onclick = (e) => { const b = e.target.closest("button"); if (b) pick(b.dataset.v); };
  S.keyHandler = (e) => { if (document.activeElement === $("nt")) return; const n = +e.key; if (n >= 1 && n <= PAIR.length) { e.preventDefault(); pick(PAIR[n - 1][0]); } };
}

// ---------- settle disagreements (shared items answered differently)
const R = { task: null, list: [], pos: 0, showSettled: false };
const LABEL_OF = { ...Object.fromEntries(AUDIT), ...Object.fromEntries(PAIR), correct: "Correct as is", corrected: "Corrected", unusable: "Can't use" };

async function review(task) {
  S.task = null; S.item = null; R.task = task; header(); $("hdr-home").classList.remove("hidden");
  app.innerHTML = `<p class="muted">Loading…</p>`;
  try { R.list = (await api("mismatches", { query: { task } })).items; } catch (e) { if (e.message !== "auth") app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  R.pos = Math.max(0, R.list.findIndex((d) => !d.resolution));
  renderReview();
}
function renderReview() {
  const open = R.list.filter((d) => !d.resolution).length;
  const head = `<div class="row" style="margin:0 0 10px"><b>Settle disagreements · ${TASKS[R.task].short}</b>
    <span class="muted">${open} open · ${R.list.length - open} settled</span><span class="spacer"></span></div>
    <p class="muted">Do this together after your separate sessions. Everyone's original answers are kept as they are; the agreed answer is stored separately.</p>`;
  if (!R.list.length) { app.innerHTML = head + `<div class="card">No disagreements in this task (yet).</div>`; return; }
  const d = R.list[R.pos], it = d.item, p = it.payload;
  const nav = `<div class="row"><button id="rv-prev" ${R.pos ? "" : "disabled"}>← Previous</button>
    <span class="muted">${R.pos + 1} of ${R.list.length}${d.resolution ? ` · settled by ${esc(d.resolution.resolved_by)}` : ""}</span>
    <button id="rv-next" ${R.pos < R.list.length - 1 ? "" : "disabled"}>Next →</button><span class="spacer"></span>
    <span class="err" id="why"></span><button class="primary" id="rv-save">Save agreed answer</button></div>`;
  const audio = it.clip_url ? `<audio id="au" controls preload="auto" src="${esc(it.clip_url)}"></audio>` : "";
  const agreed = d.resolution ? d.resolution.data : null;
  let body = "", collect;
  if (R.task === "pair") {
    const hl = (ws, i) => ws.map((w, k) => k === i ? `<b>${esc(w)}</b>` : esc(w)).join(" ");
    let pick = agreed ? agreed.label : "";
    body = `<div class="pair bn">${esc(p.ref_word)} <span class="muted">→</span> ${esc(p.hyp_word)}</div>
      ${p.examples.map((x) => `<div class="ex bn"><span class="k">Transcript</span>${hl(x.ref, x.ref_i)}<br><span class="k">Recognizer</span>${hl(x.hyp, x.hyp_i)}</div>`).join("")}
      <label class="f">Answers</label>${d.answers.map((a) => `<div>${esc(a.annotator)}: <b>${esc(LABEL_OF[a.data.label] || a.data.label)}</b>${a.data.note ? ` <span class="muted">(${esc(a.data.note)})</span>` : ""}</div>`).join("")}
      <label class="f">Agreed</label><div class="choices" id="ag">${PAIR.map(([v, t]) => `<button data-v="${v}" class="${pick === v ? "sel" : ""}">${t}</button>`).join("")}</div>`;
    collect = () => pick ? { label: pick } : null;
    setTimeout(() => { $("ag").onclick = (e) => { const b = e.target.closest("button"); if (b) { pick = b.dataset.v; for (const x of $("ag").children) x.classList.toggle("sel", x === b); } }; });
  } else if (R.task === "audit") {
    const choices = agreed ? [...agreed.units] : p.units.map((_, k) => {
      const vals = d.answers.map((a) => a.data.units[k]);
      return vals.every((v) => v === vals[0]) ? vals[0] : "";
    });
    body = `${audio}${auditLines(p)}<div id="units">${p.units.map((u, k) => {
      const vals = d.answers.map((a) => a.data.units[k]), same = vals.every((v) => v === vals[0]);
      return `<div class="unit${same ? "" : " cur"}" data-k="${k}"><span class="muted">${k + 1}</span><span class="pairtxt bn">${unitText(p, u)}</span>
        <span class="muted" style="flex:1">${d.answers.map((a) => `${esc(a.annotator)}: <b>${esc(LABEL_OF[a.data.units[k]] || "")}</b>`).join(" · ")}</span>
        ${same ? `<span class="muted">same</span>` : `<span class="choices" style="flex-basis:100%;margin:0">${AUDIT.map(([v, t]) =>
          `<button data-k="${k}" data-v="${v}" class="${choices[k] === v ? "sel" : ""}">${t}</button>`).join("")}</span>`}</div>`;
    }).join("")}</div>`;
    collect = () => choices.every(Boolean) ? { units: choices } : null;
    setTimeout(() => { $("units").onclick = (e) => { const b = e.target.closest("button[data-v]"); if (!b) return; choices[+b.dataset.k] = b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b)); }; });
  } else {
    let status = agreed ? agreed.status : "";
    const orig = toks(p.text), diffs = d.answers.map((a) => diffWords(orig, toks(a.data.text)));
    const touched = new Set(diffs.flatMap((ops) => ops.filter((o) => o.t === "del").map((o) => o.i)));
    const origHtml = orig.map((w, k) => touched.has(k) ? `<mark class="dm">${esc(w)}</mark>` : esc(w)).join(" ");
    body = `<div class="muted">${p.duration} s</div>${audio}<label class="f">Original transcript <span class="muted">(highlighted: words someone changed or removed)</span></label><div class="text bn">${origHtml}</div>
      ${d.answers.map((a, k) => `<label class="f">${esc(a.annotator)}: ${esc(LABEL_OF[a.data.status] || a.data.status)}${a.data.cut_off ? " · words cut off" : ""}${a.data.note ? ` · ${esc(a.data.note)}` : ""}</label>
        <div class="text bn">${diffHtml(diffs[k])}</div><div class="chg bn"><span class="muted">Changes:</span> ${diffSummary(diffs[k])}</div>
        <div class="row" style="margin-top:4px"><button data-use="${k}">Use this text</button></div>`).join("")}
      <label class="f" for="rv-tx">Agreed text</label><textarea id="rv-tx" class="bn">${esc(agreed ? agreed.text : d.answers[0].data.text)}</textarea>
      <div class="choices" id="ag">${[["correct", "Correct as is"], ["corrected", "Corrected"], ["unusable", "Can't use"]].map(([v, t]) => `<button data-v="${v}" class="${status === v ? "sel" : ""}">${t}</button>`).join("")}</div>`;
    collect = () => status ? { status, text: $("rv-tx").value.trim().replace(/\s+/g, " "), cut_off: d.answers.some((a) => a.data.cut_off) } : null;
    setTimeout(() => {
      $("ag").onclick = (e) => { const b = e.target.closest("button"); if (b) { status = b.dataset.v; for (const x of $("ag").children) x.classList.toggle("sel", x === b); } };
      app.querySelectorAll("button[data-use]").forEach((b) => b.onclick = () => { $("rv-tx").value = d.answers[+b.dataset.use].data.text; });
    });
  }
  app.innerHTML = head + `<div class="card">${body}${nav}</div>`;
  $("rv-prev").onclick = () => { R.pos--; renderReview(); };
  $("rv-next").onclick = () => { R.pos++; renderReview(); };
  $("rv-save").onclick = async () => {
    const data = collect();
    if (!data) { $("why").textContent = "Choose an agreed answer for every difference first."; return; }
    try {
      await api("resolve", { body: { item_id: it.id, data } });
      d.resolution = { data, resolved_by: S.who };
      const nxt = R.list.findIndex((x, i) => !x.resolution && i > R.pos);
      const any = R.list.findIndex((x) => !x.resolution);
      R.pos = nxt >= 0 ? nxt : any >= 0 ? any : R.pos;
      renderReview();
    } catch (e) { if (e.message !== "auth") $("why").textContent = "Not saved: " + e.message; }
  };
}

document.addEventListener("keydown", (e) => {
  if (!S.task || !S.item) return;
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); const b = $("save"); if (b && !b.classList.contains("hidden")) b.click(); return; }
  if (e.ctrlKey && e.code === "Space") { e.preventDefault(); const a = $("au"); if (a) a.paused ? a.play() : a.pause(); return; }
  if (S.task !== "ref" && S.keyHandler && !e.ctrlKey && !e.altKey && !e.metaKey) S.keyHandler(e);
});

if (S.pass && S.who) home(); else signIn();
</script>
